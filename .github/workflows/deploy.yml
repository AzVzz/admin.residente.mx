name: Deploy admin.residente.mx (Docker)

# Redeploy bump: 2026-08-07 (LIYPE metricas B2B, post-outage)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: residentemx/residente-admin-mx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull residentemx/residente-admin-mx:latest

            # El nginx de produccion es /root/admin-nginx.conf, no el de la imagen.
            # Sin estas rutas, WhatsApp recibe el mismo HTML para el 27 y el 28.
            CONF=/root/admin-nginx.conf
            if ! grep -q CRISIS_OG_ROUTES "$CONF"; then
              cp "$CONF" "${CONF}.bak-crisis-og"
              awk '
                BEGIN { done = 0 }
                done == 0 && index($0, "location /admin/") {
                  print "    # CRISIS_OG_ROUTES: vista previa distinta para cada fecha"
                  print "    location = /admin/crisis-restaurantera {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/miercoles-28.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera/ {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/miercoles-28.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera-martes {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/martes-27.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera-martes/ {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/martes-27.html =404;"
                  print "    }"
                  done = 1
                }
                { print }
                END { if (done == 0) exit 1 }
              ' "$CONF" > "${CONF}.new"
              docker run --rm --network host \
                -v "${CONF}.new":/etc/nginx/conf.d/default.conf:ro \
                residentemx/residente-admin-mx:latest nginx -t
              mv "${CONF}.new" "$CONF"
            fi

            docker stop residente-admin 2>/dev/null || true
            docker rm residente-admin 2>/dev/null || true

            # IMPORTANTE: montar /root/admin-nginx.conf (puerto/proxy de Plesk).
            # Sin este mount el admin cae en 502 Bad Gateway.
            # Actualizar headers de cache del SW/index en el host file si hace falta,
            # pero NUNCA quitar el volume.
            docker run -d \
              --name residente-admin \
              --restart unless-stopped \
              --network host \
              -v /root/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              residentemx/residente-admin-mx:latest

            docker image prune -f