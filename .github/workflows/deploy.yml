name: Deploy admin.residente.mx (Docker)

# Redeploy bump: 2026-11-17d (sync build a Plesk httpdocs)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: prod
          push: true
          tags: residentemx/residente-admin-mx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull residentemx/residente-admin-mx:latest

            # El nginx de produccion es /root/admin-nginx.conf, no el de la imagen.
            # Sin estas rutas, WhatsApp recibe el mismo HTML para el 27 y el 28.
            CONF=/root/admin-nginx.conf
            if ! grep -q CRISIS_OG_ROUTES "$CONF"; then
              cp "$CONF" "${CONF}.bak-crisis-og"
              awk '
                BEGIN { done = 0 }
                done == 0 && index($0, "location /admin/") {
                  print "    # CRISIS_OG_ROUTES: vista previa distinta para cada fecha"
                  print "    location = /admin/crisis-restaurantera {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/miercoles-28.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera/ {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/miercoles-28.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera-martes {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/martes-27.html =404;"
                  print "    }"
                  print "    location = /admin/crisis-restaurantera-martes/ {"
                  print "        add_header Cache-Control \"no-cache, no-store, must-revalidate\" always;"
                  print "        try_files /admin/og/martes-27.html =404;"
                  print "    }"
                  done = 1
                }
                { print }
                END { if (done == 0) exit 1 }
              ' "$CONF" > "${CONF}.new"
              docker run --rm --network host \
                -v "${CONF}.new":/etc/nginx/conf.d/default.conf:ro \
                residentemx/residente-admin-mx:latest nginx -t
              mv "${CONF}.new" "$CONF"
            fi

            docker stop residente-admin 2>/dev/null || true
            docker rm residente-admin 2>/dev/null || true

            # IMPORTANTE: montar /root/admin-nginx.conf (puerto/proxy de Plesk).
            # Sin este mount el admin cae en 502 Bad Gateway.
            docker run -d \
              --name residente-admin \
              --restart unless-stopped \
              --network host \
              -v /root/admin-nginx.conf:/etc/nginx/conf.d/default.conf:ro \
              residentemx/residente-admin-mx:latest

            sleep 2
            JS_FILE=$(docker exec residente-admin sh -c 'ls /usr/share/nginx/html/admin/assets/index-*.js 2>/dev/null | head -1' || true)
            if [ -n "$JS_FILE" ]; then
              echo "OK asset en container: $(basename "$JS_FILE")"
            else
              echo "WARN: no se listo index-*.js (revisar build), pero el container ya esta up"
              docker exec residente-admin ls -la /usr/share/nginx/html/admin/ || true
            fi

            # Plesk sirve el admin desde httpdocs (ver README). El container solo
            # no basta: hay que copiar el build o /admin/assets/*.js cae al
            # index.html (Content-Type text/html) y Cloudflare lo cachea roto.
            HTTPDOCS=""
            for d in \
              "$HOME/admin.residente.mx/httpdocs" \
              "/var/www/vhosts/admin.residente.mx/httpdocs" \
              "/var/www/vhosts/residente.mx/subdomains/admin/httpdocs"
            do
              if [ -d "$d" ]; then HTTPDOCS="$d"; break; fi
            done
            if [ -n "$HTTPDOCS" ]; then
              echo "Sync build -> $HTTPDOCS"
              mkdir -p "$HTTPDOCS/assets"
              # Copia atomica-ish: extrae a tmp y rsync/cp
              TMPDIR=$(mktemp -d)
              docker cp residente-admin:/usr/share/nginx/html/admin/. "$TMPDIR/"
              cp -a "$TMPDIR/." "$HTTPDOCS/"
              rm -rf "$TMPDIR"
              JS_NAME=$(basename "$(ls "$HTTPDOCS/assets"/index-*.js 2>/dev/null | head -1)")
              echo "OK httpdocs index: $JS_NAME"
              # Evitar que un index.html viejo apunte a un hash que ya no existe
              if [ -n "$JS_NAME" ] && [ -f "$HTTPDOCS/assets/$JS_NAME" ]; then
                CT=$(file -b --mime-type "$HTTPDOCS/assets/$JS_NAME" || true)
                echo "mime $JS_NAME: $CT"
              fi
            else
              echo "WARN: no se encontro httpdocs de Plesk; solo queda el container Docker"
            fi

            docker image prune -f